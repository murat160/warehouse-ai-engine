# Nginx site config for Murat AI (repo: warehouse-ai-engine).
#
# This file uses the placeholder __MURAT_AI_DOMAIN__ — DO NOT install it
# verbatim. Use deploy/install-nginx.sh on the VPS to substitute the
# placeholder with your real domain (e.g. ai.murat-ai.com or
# ai.ehlitrend.com) and copy it into /etc/nginx/sites-available/.
#
#   sudo deploy/install-nginx.sh ai.your-domain.com
#
# Or do it manually:
#
#   sudo sed "s/__MURAT_AI_DOMAIN__/ai.your-domain.com/g" \
#        deploy/nginx/murat-ai.conf \
#      | sudo tee /etc/nginx/sites-available/murat-ai.conf
#   sudo ln -sf /etc/nginx/sites-available/murat-ai.conf \
#               /etc/nginx/sites-enabled/murat-ai.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate:
#
#   sudo certbot --nginx -d ai.your-domain.com --redirect \
#                --agree-tos -m you@your-domain.com -n
#
# After Certbot the ssl_certificate / ssl_certificate_key paths below
# are populated automatically. Until then keep ONLY the HTTP server block
# (install-nginx.sh handles this bootstrap automatically).

# ----------------------------------------------------------------------
# HTTP — redirects everything to HTTPS once Certbot has run, plus the
# /.well-known/acme-challenge/ path that Certbot uses to verify the domain.
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __MURAT_AI_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS — terminates TLS, proxies to the Streamlit container on
# 127.0.0.1:8501 and keeps the WebSocket open for live UI updates.
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __MURAT_AI_DOMAIN__;

    # Issued by Certbot (`certbot --nginx -d __MURAT_AI_DOMAIN__`).
    ssl_certificate     /etc/letsencrypt/live/__MURAT_AI_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MURAT_AI_DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__MURAT_AI_DOMAIN__/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Streamlit-specific tuning.
    client_max_body_size 500M;          # large media uploads
    proxy_read_timeout 600s;            # ASR / TTS jobs can take minutes
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_buffering off;                # stream Streamlit responses

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Murat AI Streamlit app — main entry.
    location / {
        proxy_pass http://127.0.0.1:8501;
    }

    # WebSocket Streamlit uses for live UI updates.
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Health probe that bypasses the UI.
    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }
}
