# Nginx site config for Murat AI (repo: warehouse-ai-engine).
#
# Default placeholder is ai.murat-ai.com — replace with whatever subdomain
# you point at this VPS (e.g. translator.murat-ai.com or ai.your-domain.com).
# After Certbot has issued a certificate the ssl_certificate paths below
# resolve; until then keep the HTTP-only block (see
# docs/self-hosted-deploy.md for the bootstrap flow).
#
# Save as /etc/nginx/sites-available/murat-ai.conf and symlink it into
# sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name ai.murat-ai.com;

    # Allow Certbot HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS once the certificate exists.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.murat-ai.com;

    # Issued by Certbot (`certbot --nginx -d ai.murat-ai.com`).
    ssl_certificate     /etc/letsencrypt/live/ai.murat-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.murat-ai.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ai.murat-ai.com/chain.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Streamlit-specific tuning.
    client_max_body_size 500M;          # large media uploads
    proxy_read_timeout 600s;            # ASR / TTS jobs can take minutes
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_buffering off;                # stream Streamlit responses

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Streamlit serves both HTTP responses and a WebSocket on the same port.
    location / {
        proxy_pass http://127.0.0.1:8501;
    }

    # The websocket endpoint Streamlit uses for live UI updates.
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;     # keep WS open for long sessions
    }

    # Health probe that bypasses Streamlit's UI.
    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }
}
